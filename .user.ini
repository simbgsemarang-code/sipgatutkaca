; Batas upload dinaikkan supaya berkas PBG/konsultasi/foto sampai
; 100MB (lihat max_size di controller terkait) tidak ditolak PHP
; sebelum sempat diproses aplikasi. Berlaku di hosting PHP-FPM/CGI
; (kebanyakan cPanel modern) - butuh beberapa menit sebelum aktif
; (lihat user_ini.cache_ttl).
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
