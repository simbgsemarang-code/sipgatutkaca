name: Deploy ke cPanel (sipgatutkaca.sigaru.my.id)

# Jalan otomatis tiap kali ada push/merge ke "main", atau bisa dipicu
# manual lewat tab Actions di GitHub ("Run workflow").
#
# Pakai rsync lewat SSH -- bukan FTP. FTP (baik FTPS maupun polos)
# gagal karena firewall server memblokir koneksi data passive-mode-nya
# (lihat riwayat commit). SSH cuma butuh satu koneksi jadi tidak kena
# masalah itu.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync file ke document root subdomain via SSH/rsync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          set +e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST="${{ secrets.SSH_HOST }}"
          PORT="${{ secrets.SSH_PORT }}"
          echo "Panjang SSH_HOST: ${#HOST} karakter, panjang SSH_PORT: ${#PORT} karakter"

          echo "--- Tes koneksi TCP mentah ke host:port (timeout 15s) ---"
          timeout 15 bash -c "echo > /dev/tcp/$HOST/$PORT"
          echo "Hasil tes TCP mentah: exit code $?"

          echo "--- ssh-keyscan (verbose, stderr digabung) ---"
          ssh-keyscan -T 15 -p "$PORT" "$HOST" > /tmp/keyscan.log 2>&1
          echo "Hasil ssh-keyscan: exit code $?"
          echo "Isi /tmp/keyscan.log:"
          cat /tmp/keyscan.log
          grep -v '^#' /tmp/keyscan.log >> ~/.ssh/known_hosts 2>/dev/null

          set -e
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts kosong -- SSH tidak terjangkau. Lihat hasil tes TCP & ssh-keyscan di atas."
            exit 1
          fi
          echo "known_hosts terisi ($(wc -l < ~/.ssh/known_hosts) baris)."

      - name: Deploy via rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github' \
            --exclude='.github/**' \
            --exclude='application/config/database.php' \
            --exclude='application/logs/' \
            --exclude='application/cache/' \
            --exclude='_legacy_html_backup/' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/xmfbccbr/sipgatutkaca.sigaru.my.id/"

      - name: Bersihkan key sementara
        if: always()
        run: rm -f ~/.ssh/deploy_key
