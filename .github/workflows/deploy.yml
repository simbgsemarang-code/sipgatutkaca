name: Deploy ke cPanel (sipgatutkaca.sigaru.my.id)

# STATUS: NONAKTIF SEMENTARA (lihat DEPLOY.md bagian 9). Baik FTPS
# maupun FTP polos gagal dengan "Timeout when trying to open data
# connection" -- firewall server memblokir port data passive-mode FTP
# dari IP GitHub Actions. Trigger otomatis di "push" sengaja dikomat-in
# dulu supaya tiap commit ke main tidak menghasilkan run yang pasti
# gagal. "workflow_dispatch" tetap aktif untuk re-test manual kalau
# sudah ada perbaikan (mis. buka port di firewall, atau ganti ke SFTP).
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload file ke document root subdomain via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS gagal: firewall server tidak bisa membuka data-connection
          # untuk channel yang terenkripsi (timeout saat upload file
          # pertama). FTP polos memungkinkan firewall "mengintip" negosiasi
          # PASV dan otomatis membuka portnya.
          protocol: ftp
          local-dir: ./
          server-dir: ./
          # Jangan hapus file di server yang tidak ada di repo -- supaya
          # database.php, folder logs, dan cache milik server tidak
          # ikut kehapus tiap deploy.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            application/config/database.php
            application/logs/**
            application/cache/**
            _legacy_html_backup/**
